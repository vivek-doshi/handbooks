<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Netflix Style V Loader</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    width:100%;
    height:100vh;
    overflow:hidden;
    background:#000;
    display:flex;
    justify-content:center;
    align-items:center;
    font-family:Arial, Helvetica, sans-serif;
}

/* =========================================
   CENTER V
========================================= */

.loader{
    position:relative;
    width:220px;
    height:240px;
    display:flex;
    justify-content:center;
    align-items:center;
}

/* PERFECT SIMPLE V */
.v{
    position:relative;
    font-size:180px;
    font-weight:900;
    color:#e50914;
    line-height:1;

    transform:scale(.2);

    animation:
        growV 1.6s ease forwards,
        fadeV .4s linear forwards 2.1s;
}

/* subtle depth */
.v::before{
    content:"V";
    position:absolute;
    inset:0;
    color:#7d0000;
    transform:translateX(-8px);
    z-index:-1;
}

/* =========================================
   SPLIT LIGHT
========================================= */

.split-light{
    position:absolute;
    top:10%;
    left:50%;

    width:4px;
    height:80%;

    transform:translateX(-50%);

    background:
        linear-gradient(
            to bottom,
            rgba(255,255,255,1),
            rgba(255,80,80,1),
            rgba(255,0,0,.2)
        );

    opacity:0;
    filter:blur(.5px);

    animation:
        showSplit .15s linear forwards 1.55s,
        expandSplit .55s ease-out forwards 1.75s;
}

/* =========================================
   LIGHT STREAKS
========================================= */

.streaks{
    position:fixed;
    inset:0;
    pointer-events:none;
    overflow:hidden;
}

/* THIN LIGHT LINES */
.streak{
    position:absolute;
    top:-20%;
    left:50%;

    width:2px;
    height:140vh;

    opacity:0;

    background:
        linear-gradient(
            to bottom,
            transparent,
            rgba(255,255,255,.95),
            rgba(255,0,0,.9),
            rgba(120,0,0,.8),
            transparent
        );

    filter:blur(.4px);

    transform-origin:center;

    animation:
        streakMove 1.8s cubic-bezier(.19,.8,.22,1) forwards;
}

/* dense center like netflix */
.streak:nth-child(1){ --move:-2vw; animation-delay:2s; }
.streak:nth-child(2){ --move:2vw; animation-delay:2.02s; }

.streak:nth-child(3){ --move:-6vw; animation-delay:2.04s; }
.streak:nth-child(4){ --move:6vw; animation-delay:2.06s; }

.streak:nth-child(5){ --move:-10vw; animation-delay:2.08s; }
.streak:nth-child(6){ --move:10vw; animation-delay:2.1s; }

.streak:nth-child(7){ --move:-14vw; animation-delay:2.12s; }
.streak:nth-child(8){ --move:14vw; animation-delay:2.14s; }

.streak:nth-child(9){ --move:-18vw; animation-delay:2.16s; }
.streak:nth-child(10){ --move:18vw; animation-delay:2.18s; }

.streak:nth-child(11){ --move:-22vw; animation-delay:2.2s; }
.streak:nth-child(12){ --move:22vw; animation-delay:2.22s; }

.streak:nth-child(13){ --move:-26vw; animation-delay:2.24s; }
.streak:nth-child(14){ --move:26vw; animation-delay:2.26s; }

.streak:nth-child(15){ --move:-30vw; animation-delay:2.28s; }
.streak:nth-child(16){ --move:30vw; animation-delay:2.3s; }

.streak:nth-child(17){ --move:-36vw; animation-delay:2.32s; }
.streak:nth-child(18){ --move:36vw; animation-delay:2.34s; }

.streak:nth-child(19){ --move:-42vw; animation-delay:2.36s; }
.streak:nth-child(20){ --move:42vw; animation-delay:2.38s; }

.streak:nth-child(21){ --move:-48vw; animation-delay:2.4s; }
.streak:nth-child(22){ --move:48vw; animation-delay:2.42s; }

/* glow */
.glow{
    position:fixed;
    inset:0;

    background:
        radial-gradient(
            circle,
            rgba(255,0,0,.2),
            transparent 60%
        );

    opacity:0;

    animation:glowFlash 1.2s ease-out forwards 1.9s;
}

/* =========================================
   ANIMATIONS
========================================= */

@keyframes growV{

    0%{
        transform:scale(.15);
        opacity:0;
        filter:blur(10px);
    }

    70%{
        transform:scale(1.08);
        opacity:1;
        filter:blur(0);
    }

    100%{
        transform:scale(1);
        opacity:1;
    }
}

@keyframes fadeV{
    to{
        opacity:0;
        filter:blur(10px);
    }
}

@keyframes showSplit{
    to{
        opacity:1;
    }
}

@keyframes expandSplit{

    0%{
        width:4px;
        opacity:1;
    }

    100%{
        width:120vw;
        opacity:0;
        filter:blur(18px);
    }
}

/* KEY NETFLIX EFFECT */
@keyframes streakMove{

    0%{
        opacity:0;
        transform:
            translateX(0)
            scaleY(0);
    }

    10%{
        opacity:1;
        transform:
            translateX(0)
            scaleY(1);
    }

    100%{
        opacity:0;

        transform:
            translateX(var(--move))
            scaleY(1.25);
    }
}

@keyframes glowFlash{

    0%{
        opacity:0;
        transform:scale(.5);
    }

    40%{
        opacity:1;
    }

    100%{
        opacity:0;
        transform:scale(2);
    }
}

</style>
</head>
<body>

<div class="glow"></div>

<div class="loader">

    <!-- CLEAN V -->
    <div class="v">V</div>

    <!-- SPLIT -->
    <div class="split-light"></div>

</div>

<!-- LIGHT STREAKS -->
<div class="streaks">

    <div class="streak"></div>
    <div class="streak"></div>
    <div class="streak"></div>
    <div class="streak"></div>
    <div class="streak"></div>
    <div class="streak"></div>
    <div class="streak"></div>
    <div class="streak"></div>
    <div class="streak"></div>
    <div class="streak"></div>

    <div class="streak"></div>
    <div class="streak"></div>
    <div class="streak"></div>
    <div class="streak"></div>
    <div class="streak"></div>
    <div class="streak"></div>
    <div class="streak"></div>
    <div class="streak"></div>
    <div class="streak"></div>
    <div class="streak"></div>

    <div class="streak"></div>
    <div class="streak"></div>

</div>

</body>
</html>
