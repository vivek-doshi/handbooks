name: Validate Handbooks

on:
  pull_request:
    paths:
      - '**/*.html'
      - 'README.md'
      - '.github/workflows/**'
  push:
    branches:
      - main
    paths:
      - '**/*.html'
      - 'README.md'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-index-and-links:
    name: Validate index and handbook links
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate handbook catalog
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import sys

          root = Path('.')
          index = root / 'index.html'
          readme = root / 'README.md'

          if not index.exists():
              print('index.html is missing')
              sys.exit(1)

          html = index.read_text(encoding='utf-8')

          total_match = re.search(r'<strong data-handbook-total>(\d+)</strong>', html)
          if not total_match:
              print('Could not find handbook total in index.html')
              sys.exit(1)

          declared_total = int(total_match.group(1))
          actual_total = len(re.findall(r'<article class="handbook-card">', html))
          if declared_total != actual_total:
              print(f'Handbook total mismatch: declared {declared_total}, found {actual_total}')
              sys.exit(1)

          hrefs = re.findall(r'<a class="card-link" href="([^"]+)"', html)
          missing = []
          for href in hrefs:
              if href.startswith('http://') or href.startswith('https://'):
                  continue
              target = root / href
              if not target.exists():
                  missing.append(href)

          if missing:
              print('Missing handbook targets:')
              for item in missing:
                  print(f' - {item}')
              sys.exit(1)

          if not readme.exists():
              print('README.md is missing')
              sys.exit(1)

          print(f'Validated {actual_total} handbook cards and {len(hrefs)} handbook links successfully.')
          PY
